name: Backend tests

on:
  push:
    paths:
      - "Personal finance/ledgerflow/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "Personal finance/ledgerflow/backend/**"
      - ".github/workflows/backend-tests.yml"

defaults:
  run:
    working-directory: Personal finance/ledgerflow/backend

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "Personal finance/ledgerflow/backend/requirements-dev.txt"

      - run: pip install -r requirements-dev.txt

      - run: pytest -q
