[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is overridden at runtime by alembic/env.py from the
# DATABASE_URL environment variable — this is just a placeholder so the
# Alembic CLI has a value to validate against.
sqlalchemy.url = postgresql://ledger:ledger@localhost:5432/ledgerflow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
